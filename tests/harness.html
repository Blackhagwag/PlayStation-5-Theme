<!doctype html>
<html><head><meta charset="utf-8"><title>Steam</title>
<link rel="stylesheet" href="../css/root.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="../css/menus.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<style>
 /* the mock's own skeleton (Steam's real layout comes from Steam) */
 html,body{margin:0;height:100%;overflow:hidden;color:#fff}
 #popup_target{display:flex;flex-direction:column;height:100%}
 .TitleBar{height:32px;display:flex;align-items:center;padding:0 8px;flex:none}
 .URLBarReplacement{height:32px;background:#171d25;flex:none}
 .SuperNavMenu{width:101px;overflow:hidden}.SuperNavMenu .MenuButton{font-size:20px;text-transform:uppercase}
 .BrowserWrapper .URLBar{height:32px;background:#222;display:flex;align-items:center}
 .LocalContentContainer{flex-direction:column}.LibraryInner{flex:1;display:flex;min-height:0}
 .DownloadStatus{flex:1;display:flex;justify-content:center}.DetailedDownloadProgress{width:720px;display:flex}
 .TitleBarControls{display:flex;gap:4px}.TitleBarControls .Button{width:28px;height:24px;display:grid;place-items:center;opacity:.6}
 .ContentFrame{flex:1;display:flex;flex-direction:column;min-height:0}
 .LocalContentContainer{flex:1;display:flex;min-height:0}
 .LeftListSizableContainer{width:270px;display:flex;flex-direction:column}
 .LeftListSizableContainer .Container{padding:10px;font-size:13px;overflow:auto}
 .LeftListSizableContainer .row{padding:6px 10px}
 .MainPanel{flex:1;min-width:0;display:flex;flex-direction:column}
 .AppDetailsTransitionGroup{flex:1;overflow:auto;position:relative}
 .LibraryHome{padding:20px 56px}.LibraryHome .Shelf{display:flex;gap:14px}.LibraryHome .LibraryItemBox{width:150px;height:225px;background:#223}
 .Header .TopCapsule{position:relative;height:52vh}.HeaderBackgroundImage img{width:100%;height:100%;object-fit:cover}
 .PlayBar{display:flex;align-items:center;gap:30px;padding:16px 28px}
 .PlayButton{height:44px;border:none;font-size:16px;padding:0 28px}
 .BottomBar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px}
 .BrowserWrapper{flex:1}
 .UpdatesContainer{display:flex;gap:16px}.PartnerEventRowCapsule_Container{width:260px}.PartnerEventRowCapsule_Container>div{height:230px;display:flex;flex-direction:column}
 .PartnerEventRowCapsule_Container img{width:100%;height:120px;object-fit:cover}.PartnerEventRowCapsule_TextTitle{padding:8px 12px}
</style></head>
<body class="DesktopUI">
<div id="popup_target">
  <div class="OuterFrame"><div class="TopBar">
  <div class="TitleBar"><div class="RootMenuBar"><div class="RootMenuButton"><div>Steam</div></div><div class="RootMenuButton"><div>View</div></div><div class="RootMenuButton"><div>Friends</div></div><div class="RootMenuButton"><div>Games</div></div><div class="RootMenuButton"><div>Help</div></div></div><div style="flex:1"></div><div class="TitleBarControls"><div class="AccountMenu" id="acct"><span>Vasya_PS5</span> <span class="WalletBalance">12,50€</span></div><div class="Button">▢</div><div class="Button">_</div><div class="Button">✕</div></div></div>
  <div class="SuperNavBar"><div class="SuperNav"><svg class="Arrow Enabled" id="steam-back" viewBox="0 0 10 10" onclick="window.__back=(window.__back||0)+1"><path d="M6 2L3 5l3 3"/></svg><svg class="Arrow Disabled" id="steam-fwd" viewBox="0 0 10 10"><path d="M4 2l3 3-3 3"/></svg><div class="MenuWrapper">
    <div class="SuperNavMenu"><div class="MenuButton">Store</div></div>
    <div class="SuperNavMenu Selected"><div class="MenuButton">Library</div></div>
    <div class="SuperNavMenu"><div class="MenuButton">Community</div></div>
    <div class="SuperNavMenu"><div class="MenuButton"><span>Vasya_PS5</span></div></div>
  </div></div></div>
  </div></div>
  <div class="ContentFrame"><div class="LocalContentContainer Library"><div class="URLBarReplacement"></div><div class="LibraryInner">
    <div class="LeftListSizableContainer"><div class="Container"><div class="row">Starfall Odyssey</div><div class="row Selected">Neon Drift Racing</div><div class="row">Hollow Kingdom</div></div></div>
    <div class="LibraryWindowDivider"></div>
    <div class="MainPanel"><div class="AppDetailsTransitionGroup" id="route"></div></div>
  </div></div></div>
  <div class="BottomBarContainer"><div class="BottomBar"><div class="AddGameButton"><div class="Icon"><svg width="12" height="12"></svg></div><div class="Text">Add a Game</div></div><div class="DownloadStatus"><div class="DownloadStatusContent"><div class="DetailedDownloadProgress"><div class="Icon"></div><div class="IconBevel"></div><div class="ProgressBarWrapper"><div class="StatusLine"><span class="Status">Downloading Iron Tactics</span><span class="Status Percentage">60%</span></div><div class="ProgressBar"><div style="width:60%;height:100%"></div></div></div></div></div></div><div class="FriendsButton"><div class="Text">Friends &amp; Chat</div><div class="Icon"><svg width="12" height="12"></svg></div></div></div></div>
</div>
<script src="mock-steam.js"></script>
<script>
 window.__mockRoute = p => {
   const r = document.getElementById('route');
   const m = /^\/library\/app\/(\d+)/.exec(p);
   if (m) {
     r.innerHTML = `<div class="AppDetailsMain"><div class="Container"><div class="Body ScrollContainer" style="height:100%;overflow:auto">
       <div class="Header"><div class="TopCapsule"><div class="HeaderBackgroundImage"><img src="/assets/${m[1]}/library_hero.jpg"></div></div></div>
       <div class="AppDetailsOverviewPanel"><div class="Container InPage"><div class="Row" style="display:flex;align-items:center;gap:20px;height:72px;padding:0 18px;background:#1a2433">
         <div class="PlayButtonContainer" style="display:flex;background:#1a9fff"><button class="PlayButton" style="height:44px;border:none;padding:0 26px;background:#1a9fff"><span class="ButtonText" style="color:#fff">УСТАНОВИТЬ</span></button></div>
         <div class="GameStat Panel" id="gstat" style="background:#2a3a4d;border-radius:4px;padding:6px 10px"><div class="PlayBarLabel">Требуется места</div><div class="PlayBarDetailLabel">75,84 Гбайт</div></div>
         <div class="GameStat Panel" style="background:#2a3a4d;padding:6px 10px"><div class="PlayBarLabel">Вы играли</div><div class="PlayBarDetailLabel">81,7 ч.</div></div>
         <div style="flex:1"></div><div class="AppButtonsContainer"><div class="MenuButton" style="width:32px;height:32px">⚙</div></div>
       </div></div></div>
       <div class="LinksSection"><div class="AppDetailsSectionContainer"><div class="Links Panel"><a>Страница в магазине</a><a>Доп. контент</a><a>Центр сообщества</a></div></div></div>
       <div style="display:flex;gap:16px;padding:16px">
         <div style="flex:2;display:flex;flex-direction:column;gap:16px">
           <div class="ReviewContainer" style="background:#3b5a7a;padding:14px">Вы играли 81 ч. Вы бы порекомендовали эту игру? <button class="DialogButton">Да</button></div>
           <div class="AppDetailsSectionContainer" id="featsec" style="padding:10px"><div class="PartnerEventFeatured" id="feat" style="border:3px solid;border-image:linear-gradient(#1a9fff,#1a9fff) 1;margin:-6px"><div class="PartnerEventFeaturedHeader" style="background:#1a9fff;padding:4px 10px">ИЗБРАННОЕ</div><div style="padding:20px;height:120px">КРУПНОЕ ОБНОВЛЕНИЕ — Обновление 2.5</div></div></div>
           <div class="AppDetailsSectionContainer" style="padding:16px;height:400px"><div class="SectionHeader">Активность</div><div class="ActivityFeedContainer"><div class="Panel" style="background:#223;height:60px"></div></div></div>
         </div>
         <div style="flex:1"><div class="AppDetailsSectionContainer" style="padding:16px;height:260px"><div class="SectionHeader">Играющие друзья</div></div></div>
       </div>
     </div></div></div>`;
   } else {
     r.innerHTML = `<div class="AppDetailsMain"><div class="Container"><div class="Body InnerContainer"><div class="whatsnew-shelf"><h2 class="SectionHeader">What's New</h2><div class="UpdatesContainer">${[101,103,104].map((id,i)=>`<div><div class="EventTime">${['This week','Yesterday','2 days ago'][i]}</div><div class="PartnerEventRowCapsule_Container"><div><img src="/assets/${id}/header.jpg"><div class="PartnerEventRowCapsule_TextTitle">${['Major update 2.0 is live','Patch notes 1.4.2','Weekend event starts now'][i]}</div><div class="GameIconAndName"><span class="GameIcon"></span><span class="GameName">Game</span></div></div></div></div>`).join('')}</div></div><div class="LibraryHome"><h2 class="SectionHeader">Recent Games</h2><div class="Shelf"><div class="LibraryItemBox"></div><div class="LibraryItemBox"></div><div class="LibraryItemBox"></div></div></div></div></div></div>`;
   }
   const web = /^\/browser/.test(p);
   document.querySelector('.LocalContentContainer').style.display = web ? 'none' : '';
   document.querySelectorAll('.SuperNavMenu').forEach((m, k) => m.classList.toggle('Selected', web ? k === 0 : k === 1));
   let bw = document.querySelector('.BrowserWrapper');
   if (web && !bw) { bw = document.createElement('div'); bw.className = 'BrowserWrapper'; bw.innerHTML = '<div class="URLBar"><div class="ReloadButton" onclick="window.__reload=(window.__reload||0)+1">⟳</div><div class="URLBarText"><span class="URL">https://store.steampowered.com/app/101/Starfall_Odyssey/</span></div></div><div style="padding:40px;color:#000;background:#c6d4df;height:100%">STORE WEB VIEW (native CEF view in real Steam)</div>'; document.querySelector('.ContentFrame').appendChild(bw); }
   if (bw) bw.style.display = web ? '' : 'none';
 };
 window.__mockRoute('/library/home');
</script>
<script type="module" src="../js/ps5.js"></script>
</body></html>
