name: Build & Release

# Every push: validate the theme and build the ZIP (downloadable as a workflow artifact).
# A tag v* (or a manual run): also publish a GitHub Release with the full theme ZIP.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate theme
        run: node scripts/validate.mjs

      - name: Build and verify ZIP
        run: scripts/package.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayStation-5-Millennium-Theme
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./skin.json').version")"
          TAG="v${VERSION}"
          # release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          TITLE="$(grep -m1 "^## \[${VERSION}\]" CHANGELOG.md | sed -E 's/^## \[[^]]+\][^A-Za-z]*([0-9-]+ — )?//')"
          [ -n "$TITLE" ] || TITLE="Release"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
            gh release edit "$TAG" --title "$TAG — $TITLE" --notes-file notes.md
          else
            gh release create "$TAG" dist/*.zip dist/*.sha256 --target "$GITHUB_SHA" --title "$TAG — $TITLE" --notes-file notes.md --latest
          fi
